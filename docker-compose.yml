services:
  brook:
    build: .
    environment:
      APP_ENVIRONMENT: dev
      POSTGRES_DSN: postgres://brook:brook@postgres:5432/brook?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brook
      POSTGRES_PASSWORD: brook
      POSTGRES_DB: brook
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  arangodb:
    image: arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: brook
    ports:
      - "8530:8529"
    volumes:
      - arangodb-data:/var/lib/arangodb3

volumes:
  postgres-data:
  arangodb-data:
