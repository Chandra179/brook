services:
  brook:
    build: .
    environment:
      APP_ENVIRONMENT: dev
      # Pyroscope is run externally; this reaches whatever's published on the host at :4040.
      PYROSCOPE_SERVER_ADDRESS: http://host.docker.internal:4040
      POSTGRES_DSN: postgres://brook:brook@postgres:5432/brook?sslmode=disable
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brook
      POSTGRES_PASSWORD: brook
      POSTGRES_DB: brook
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
