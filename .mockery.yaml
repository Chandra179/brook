# yaml-language-server: $schema=https://vektra.github.io/mockery/latest/schema.json
template: testify
recursive: true
all: true
dir: "mocks/{{.InterfaceDirRelative}}"
filename: "{{.InterfaceName | snakecase}}_mock.go"
pkgname: mocks
packages:
  brook:
    config:
  brook/internal/example:
    config:
      all: false
      dir: "mocks/example"
      filename: "store_mock.go"
      pkgname: mocks
      structname: MockStore
    interfaces:
      store: {}
  brook/server:
    config:
      all: false
      dir: "mocks/server"
      filename: "readiness_store_mock.go"
      pkgname: mocks
      structname: MockReadinessStore
    interfaces:
      readinessStore: {}
