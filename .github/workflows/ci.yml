name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -mod=vendor ./...

      - name: Docker build
        run: docker build .
