name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SQLITE_DSN: brook.db
      BADGER_DIR: badger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2

      - name: Test
        run: go test -short -race -count=1 ./...

      - name: Migrate
        run: go run github.com/pressly/goose/v3/cmd/goose@latest -dir store/migrations/sqlite sqlite3 "$SQLITE_DSN" up

      - name: Build
        run: go build ./...

      - name: Docker build
        run: docker build .